<!DOCTYPE html>

<head>

<style>
:root{
  --night:#16142f; --night2:#2a1d3d; --gold:#f2c46b; --amber:#ffb347; --cream:#f7ecd9; --ink:#2b2135;
  --rose:#d9776a; --muted:rgba(247,236,217,.62);
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--sans)}
body{
  background:radial-gradient(120% 70% at 50% 110%, rgba(255,170,80,.18), transparent 60%),
             radial-gradient(90% 60% at 50% -10%, rgba(120,70,140,.35), transparent 70%), var(--night);
  background-attachment:fixed; overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.top{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.mini{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.mj{position:relative;width:46px;height:46px;flex:none;--mg:0}
/* el tarrito: la luz va detrás del vidrio apagado; el vidrio se calienta (ámbar) a medida que se llena */
.mj canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mj img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 calc(2px + 14px*var(--mg)) rgba(255,185,85,calc(.1 + .8*var(--mg)))) sepia(calc(.75*var(--mg))) saturate(calc(1 + 2.2*var(--mg))) brightness(calc(.95 + .3*var(--mg)))}
.mini b{color:var(--gold);font-weight:700;font-size:15px}
.tbtn{font-size:14px;min-height:44px;min-width:44px;padding:8px 14px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid rgba(242,196,107,.28);color:var(--cream);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,border-color .3s}
.tbtn:active{transform:scale(.94)}
#snd{padding:0;width:44px;color:var(--gold)}
#snd svg{width:22px;height:22px;overflow:visible}
#snd .w1{animation:wv 2.4s ease-in-out infinite}#snd .w2{animation:wv 2.4s ease-in-out .35s infinite}
@keyframes wv{50%{opacity:.35}}
#snd.off{color:var(--muted);border-color:rgba(255,255,255,.14)}
.tbtns{display:flex;gap:8px}
#view{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;position:relative}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.05;margin:8px 0 10px;letter-spacing:-.5px}
h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;margin:6px 0 8px}
.lead{font-size:18px;line-height:1.4;color:var(--muted);margin:0 0 6px;max-width:340px}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero{width:min(62vw,250px);filter:drop-shadow(0 10px 40px rgba(255,170,70,.35));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.icon{width:min(48vw,190px);max-height:30vh;object-fit:contain;filter:drop-shadow(0 8px 30px rgba(255,170,70,.3));margin-bottom:6px}
.icon.sm{width:84px;max-height:84px;margin:0 0 4px}
.actions{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.btn{width:100%;padding:17px 18px;border-radius:18px;font-weight:700;font-size:18px;background:linear-gradient(180deg,#e88a79,var(--rose));color:#fff;
  box-shadow:0 8px 24px rgba(217,119,106,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;color:var(--cream);font-weight:500}
.btn.gold{background:linear-gradient(180deg,#ffd98c,#e9ad4c);color:#3a2610;box-shadow:0 8px 24px rgba(240,180,80,.35)}
.row{display:flex;gap:10px}.row .btn{flex:1;font-size:16px;padding:17px 10px}
.skip{align-self:center;font-size:16px;color:var(--muted);min-height:44px;padding:10px 20px;text-decoration:underline;text-underline-offset:3px}
.legal{font-size:14px;color:var(--muted);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:14px;margin:18px 0 6px;width:100%;max-width:330px}
.step{display:flex;align-items:center;gap:14px;text-align:left;font-size:19px;background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px}
.step img{width:52px;height:52px;object-fit:contain;flex:none}
.step .num{width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:30px}
.card{width:100%;background:linear-gradient(170deg,#fbf3e4,#f1e1c6);color:var(--ink);border-radius:26px;padding:26px 22px 24px;position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 1px rgba(242,196,107,.55) inset,0 0 0 7px rgba(255,255,255,.35) inset}
.card .eyebrow{color:#b0743a}
.card .q{font-family:var(--serif);font-size:27px;line-height:1.22;margin:10px 0 2px;font-weight:600}
.turn{display:inline-block;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(176,116,58,.13);color:#9a5f2a;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;max-height:40vh;overflow:auto;padding:4px}
.chip{padding:11px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(242,196,107,.28);font-size:16px;color:var(--cream)}
.chip.on,.chip:active{background:var(--gold);color:#3a2610;border-color:var(--gold)}
.phrase{font-family:var(--serif);font-size:26px;line-height:1.3}
.phrase em{font-style:normal;color:var(--gold)}
.meet{width:min(84vw,330px);height:min(30vh,220px);margin:8px 0 4px}
.meet canvas{width:100%;height:100%;display:block;-webkit-mask:radial-gradient(closest-side,#000 70%,transparent);mask:radial-gradient(closest-side,#000 70%,transparent)}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;margin:14px 0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
#arc{transition:stroke-dashoffset 1s linear}
.ring .n{font-family:var(--serif);font-size:56px;color:var(--gold);text-shadow:0 0 30px rgba(255,180,80,.7)}
.ring:before{content:"";position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.55),transparent 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.6}}
.pass{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer}
.phone{font-size:70px;animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:translateX(-30px) rotate(-12deg)}50%{transform:translateX(30px) rotate(12deg)}}
.jarbox{position:relative;width:min(70vw,280px,34vh);aspect-ratio:1;cursor:pointer;--glow:0;isolation:isolate}
/* capas: luz y luciérnagas de adentro (canvas.in) → vidrio apagado transparente (.jc/.jo) → el mismo vidrio
   teñido de ámbar que aparece según la luz (.warm) → luciérnagas de afuera y chispas (canvas.out) → tapa */
.jarbox .jc,.jarbox .jo,.jarbox .warm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none}
.jarbox .jc,.jarbox .jo{filter:drop-shadow(0 8px calc(14px + 40px*var(--glow)) rgba(255,170,70,calc(.08 + .55*var(--glow))))}
.jarbox .warm{z-index:3;mix-blend-mode:screen;filter:sepia(1) saturate(3.5) hue-rotate(-12deg) brightness(1.1);opacity:calc(.9*var(--glow))}
.jarbox .jc,.jarbox .wc{transform-origin:50% 92%}
.jarbox .jo,.jarbox .wo,.jarbox.isopen .jc,.jarbox.isopen .wc{display:none}
.jarbox.isopen .jo,.jarbox.isopen .wo{display:block}
.jarbox canvas{position:absolute;inset:-25%;width:150%;height:150%;pointer-events:none}
.jarbox canvas.in{z-index:1}
.jarbox canvas.out{z-index:4}
.jarbox .lidw{position:absolute;left:29.11%;top:8.29%;width:41.55%;z-index:5;pointer-events:none}
.jarbox .lid{display:block;width:100%;height:auto;opacity:0;transform-origin:50% 80%;-webkit-mask:linear-gradient(#000 0 52%,rgba(0,0,0,.75) 60%);mask:linear-gradient(#000 0 52%,rgba(0,0,0,.75) 60%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)) brightness(calc(.88 + .25*var(--glow)))}
.jarbox.isopen .lid{opacity:1}
.lidw.float{animation:lidfloat 3.2s ease-in-out infinite}
@keyframes lidfloat{50%{transform:translateY(-6%) rotate(-1.5deg)}}
.jarbox .halo{position:absolute;z-index:0;left:4%;right:4%;top:18%;bottom:-6%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,185,90,.6),rgba(255,150,60,.18) 60%,transparent);
  opacity:calc(.12 + .88*var(--glow));transition:opacity 1.2s;animation:halo 5s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.08)}}
.jarbox .rays{position:absolute;z-index:0;inset:-30%;border-radius:50%;pointer-events:none;opacity:calc(.5*var(--glow) - .1);
  background:repeating-conic-gradient(from 0deg,rgba(255,200,110,.13) 0deg 5deg,transparent 5deg 22deg);
  -webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%);mask:radial-gradient(closest-side,#000 20%,transparent 75%);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jarbox.pop .jc,.jarbox.pop .wc{animation:jpop .5s ease}
@keyframes jpop{40%{transform:scale(1.035)}}
.icon[src*="gracias"],.step img[src*="gracias"]{filter:brightness(.82) saturate(.9) drop-shadow(0 8px 22px rgba(255,170,70,.18))}
.card.flip{animation:flip .6s cubic-bezier(.2,.8,.25,1) both;transform-origin:50% 50%}
@keyframes flip{0%{transform:perspective(900px) rotateY(-85deg) scale(.94);opacity:0}60%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
.bigcount{font-family:var(--serif);font-size:54px;color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(255,180,80,.6);margin-top:-6px}
.dot{position:absolute;z-index:2;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff6d6 0,#ffd27a 35%,rgba(255,170,60,0) 72%);
  box-shadow:0 0 14px 5px rgba(255,190,90,.55);animation:twinkle 3s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes twinkle{50%{opacity:.55;transform:translateY(-4px) scale(.85)}}
.fly{position:fixed;left:0;top:0;z-index:50;width:22px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0,#ffd27a 35%,rgba(255,170,60,0) 72%);box-shadow:0 0 24px 10px rgba(255,190,90,.7)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);max-width:calc(100% - 40px);text-align:center;background:rgba(20,16,40,.92);
  border:1px solid rgba(242,196,107,.35);padding:12px 18px;border-radius:14px;font-size:16px;z-index:60;animation:fade .3s ease both}
.sheet{position:fixed;inset:0;background:rgba(5,4,15,.6);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:480px;background:#221a38;border-radius:24px 24px 0 0;padding:24px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:left;animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.sheet p{font-size:18px;line-height:1.45;margin:8px 0 18px}
.why{font-size:15px;color:var(--gold);min-height:44px;padding:8px 16px;border:1px solid rgba(242,196,107,.35);border-radius:999px;margin-top:10px}
.days{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.days span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.07);color:var(--muted)}
.days span.ok{background:var(--gold);color:#3a2610;font-weight:700}
.days span.now{outline:2px solid var(--gold)}
.list{width:100%;max-height:44vh;overflow:auto;text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list div{background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.35}
.list b{color:var(--gold);font-weight:500}
.cardimg{width:min(80vw,340px,52vh);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);margin:6px 0}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(242,196,107,.25);font-size:17px;line-height:1.3}
.opt.right{background:rgba(242,196,107,.9);color:#3a2610}
.opt.wrong{opacity:.4}
.small{font-size:15px;color:var(--muted)}
@media (max-height:700px){h1{font-size:36px}h2{font-size:25px}.lead{font-size:16px}.bigcount{font-size:42px}.hero{width:min(50vw,190px)}.btn{padding:14px 16px}.actions{gap:8px;padding-top:8px}.card{padding:20px 18px}.card .q{font-size:23px}.why{margin-top:6px}}
.name{width:100%;max-width:320px;margin-top:12px;padding:15px 16px;border-radius:16px;border:1px solid rgba(242,196,107,.35);background:rgba(255,255,255,.07);color:var(--cream);font:500 17px var(--sans);text-align:center;outline:none}
.name:focus{border-color:var(--gold)}
.name::placeholder{color:var(--muted)}
.home-pending{width:100%;background:rgba(242,196,107,.1);border:1px solid rgba(242,196,107,.35);border-radius:18px;padding:14px;margin-top:12px;font-size:15px}
</style>

<body>
<div id="app">
  <div class="top">
    <div class="mini" id="mini"><div class="mj" id="mj"><canvas id="mjc"></canvas><img src="img/frasco-apagado.webp" alt=""></div><b id="count">0</b><span id="countLbl"></span></div>
    <div class="tbtns"><button class="tbtn" id="snd" aria-label="Sonido"></button><button class="tbtn" id="lang"></button></div>
  </div>
  <div id="view"></div>
</div>
<script src="content.js"></script>
<script>
(function(){
const C = window.CONTENT;
const $ = s => document.querySelector(s);
const view = $('#view');
let L = (()=>{ try{ const s=localStorage.getItem('ln_lang'); if(s) return s; }catch(e){} return (navigator.language||'es').toLowerCase().startsWith('es')?'es':'en'; })();
const t = k => (C.ui[k]||{})[L] || k;
const tx = o => o[L];
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const split = s => { const i=s.indexOf(' — '); return i<0?[s,'']:[s.slice(0,i),s.slice(i+3)]; };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TEST = /[?&]test/.test(location.search);

/* ---------- estado guardado ---------- */
const KEY='ln_state_v1';
let S = load();
function blank(){ return {lights:0, far:false, gracias:[], secrets:[], guessed:false, d7:{done:[]}, started:null}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s && typeof s.lights==='number') return Object.assign(blank(),s); }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- sonido ---------- */
let soundOn = (()=>{ try{ return localStorage.getItem('ln_snd')!=='0'; }catch(e){ return true; } })();
let ac=null, sfxBus=null, NOISE=null;
function AC(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running'){ try{ ac.resume(); }catch(e){} } return ac; }
/* salida de efectos: seco + un eco suave generado (sin archivos) */
function bus(){
  if(sfxBus) return sfxBus; const a=AC(); sfxBus=a.createGain(); sfxBus.gain.value=.9; sfxBus.connect(a.destination);
  try{ const len=a.sampleRate*1.8|0, ir=a.createBuffer(2,len,a.sampleRate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
    const cv=a.createConvolver(); cv.buffer=ir; const wet=a.createGain(); wet.gain.value=.22; sfxBus.connect(cv).connect(wet).connect(a.destination); }catch(e){}
  return sfxBus;
}
function noise(){ if(NOISE) return NOISE; const a=AC(), n=a.sampleRate|0, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return NOISE=b; }
function tone(f,t0,dur,gain,type,att){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain,t0+(att||.015)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(bus()); o.start(t0); o.stop(t0+dur+.05); }
function hiss(t0,dur,gain,f0,f1,q){ const s=ac.createBufferSource(), bp=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=noise();
  bp.type='bandpass'; bp.Q.value=q||1; bp.frequency.setValueAtTime(f0,t0); bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain,t0+dur*.35); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(bp).connect(g).connect(bus()); s.start(t0,Math.random()*.5); s.stop(t0+dur+.05); }
const SFX={
  pass:t=>{ hiss(t,.5,.05,450,2400,.7); tone(659.25,t+.2,1,.022); tone(987.77,t+.28,.9,.014); },          /* pasar el teléfono: soplo + campanita */
  flip:t=>{ hiss(t,.11,.07,3200,1300,1.6); tone(1318.5,t+.03,.3,.014,'triangle'); },                     /* voltear carta: roce de papel */
  tick:t=>{ tone(1567.98,t,.14,.026,'triangle',.004); },                                                  /* tocar una opción */
  count:t=>{ tone(880,t,.25,.016); },                                                                     /* últimos 3 segundos */
  done10:t=>{ [659.25,783.99,987.77,1318.51].forEach((f,i)=>tone(f,t+i*.07,2.6,.04)); tone(1567.98,t+.32,2.2,.02,'triangle'); }, /* fin de los 10 s */
  sparkle:t=>{ [1567.98,1760,1975.53,2349.32].forEach((f,i)=>tone(f,t+i*.05,.7,.026,'triangle')); },
  pop:t=>{ hiss(t,.06,.14,2600,900,1.4); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(1500,t+.07);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.connect(g).connect(bus()); o.start(t); o.stop(t+.2); }, /* corcho que salta */
  tock:t=>{ hiss(t,.05,.09,1600,800,2); tone(880,t,.2,.04,'triangle',.003); tone(1318.5,t+.02,.35,.018); }, /* tapa que cierra */
  lock:t=>{ hiss(t,.07,.08,1900,800,3); tone(659.25,t+.04,.6,.045); tone(987.77,t+.14,.8,.03); },             /* detalle secreto guardado */
  bloom:t=>{ hiss(t,1.6,.035,300,3000,.5); [659.25,783.99,987.77,1046.5,1318.51].forEach((f,i)=>tone(f,t+.1+i*.11,3.2,.04));
    [1567.98,1760,1975.53,2093,2349.32].forEach((f,i)=>tone(f,t+.7+i*.07,1,.016,'triangle')); }       /* frasco lleno */
};
function sfx(name){ if(!soundOn) return; try{ AC(); SFX[name](ac.currentTime+.01); }catch(e){} }
function chime(big,quiet){
  if(!soundOn) return;
  try{
    AC();
    const scale=[659.25,739.99,783.99,880,987.77,1046.5,1174.66,1318.51,1479.98,1567.98];
    const base=scale[Math.min(S.lights,scale.length-1)];

/* ---------- música y voz (archivos opcionales en /audio) ---------- */
const music=new Audio('audio/musica.mp3'); music.loop=true; music.volume=0; music.preload='auto';
let musicOk=true; music.onerror=()=>{ musicOk=false; };
/* iPhone no deja cambiar music.volume: la música pasa por un GainNode de Web Audio */
let mGain=null, mVol=0;
function setVol(v){ mVol=v; if(mGain) mGain.gain.value=v; else music.volume=v; }
function routeMusic(){

    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(music); mGain=ac.createGain(); mGain.gain.value=mVol;
    src.connect(mGain).connect(ac.destination); music.volume=1;
  }catch(e){ mGain=null; }
}
let fadeId=0;
function fadeMusic(to,ms=1200){ if(!musicOk) return; const id=++fadeId, from=mVol, t0=performance.now();
  const step=now=>{ if(id!==fadeId) return; const k=Math.min(1,(now-t0)/ms); setVol(from+(to-from)*k); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function startMusic(){ if(!soundOn||!musicOk) return; routeMusic(); try{ if(ac && ac.state!=='running') ac.resume(); }catch(e){}
  music.play().then(()=>fadeMusic(voice?.12:.35)).catch(()=>{}); }
let voice=null;
function playVoice(name){ stopVoice(); if(!soundOn) return; voice=new Audio('audio/'+name+'_'+L+'.mp3');
  voice.onerror=()=>{ voice=null; }; fadeMusic(.12,500); voice.onended=()=>{ voice=null; fadeMusic(.35); }; voice.play().catch(()=>{}); }
function stopVoice(){ if(voice){ try{voice.pause()}catch(e){} voice=null; fadeMusic(.35,500); } }
document.addEventListener('pointerdown',()=>{ if(!soundOn) return; if(music.paused) startMusic(); else { try{ if(ac && ac.state!=='running') ac.resume(); }catch(e){} } },{passive:true});

const SPR=SPRS[0];

    const counter=document.getElementById(box.dataset.counter||'_none');

      for(const g of [gi,go]){ g.setTransform(dpr,0,0,dpr,W*PAD*dpr,H*PAD*dpr); g.clearRect(-W*PAD,-H*PAD,W*(1+2*PAD),H*(1+2*PAD)); g.globalCompositeOperation='lighter'; }

/* ---------- tarrito de la barra superior: se llena de luz con cada respuesta ---------- */
const MJ={lvl:0,pulse:0};
function miniJar(now){
  const c=$('#mjc'), box=$('#mj'); if(!c){ requestAnimationFrame(miniJar); return; }
  const d=Math.min(2,window.devicePixelRatio||1), Z=box.clientWidth||46; if(c.width!==Math.round(Z*d)){ c.width=c.height=Math.round(Z*d); }
  const g=c.getContext('2d'), t=now/1000, tgt=Math.min(1,S.lights/14);
  MJ.lvl+=(tgt-MJ.lvl)*.05; MJ.pulse*=.93;
  box.style.setProperty('--mg',Math.min(1,MJ.lvl*.85+MJ.pulse*.5).toFixed(3));
  g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,Z,Z);
  if(MJ.lvl>.004||MJ.pulse>.02){
    g.save(); jarPath(g,Z,Z); g.clip(); g.globalCompositeOperation='lighter';
    const bot=.873, top=bot-(bot-.30)*MJ.lvl;
    g.beginPath(); g.moveTo(0,Z); for(let x=0;x<=Z;x+=1.5) g.lineTo(x,top*Z+Math.sin(t*3+x*.4)*.7); g.lineTo(Z,Z); g.closePath();
    const gr=g.createLinearGradient(0,top*Z,0,bot*Z); gr.addColorStop(0,'rgba(255,240,185,.85)'); gr.addColorStop(.18,'rgba(255,200,105,.6)'); gr.addColorStop(1,'rgba(255,165,65,.85)');
    g.fillStyle=gr; g.fill();
    const n=Math.min(S.lights,20);
    for(let i=0;i<n;i++){ const sx=.31+.38*((i*.618+.1)%1), sy=top+(bot-top)*((i*.382+.15)%1)*.92; const b=.5+.5*Math.sin(t*2.3+i*1.7);
      g.globalAlpha=.55+.45*b; const r=Z*(.045+.03*b); g.drawImage(SPR,sx*Z-r,sy*Z-r,r*2,r*2); }
    if(MJ.pulse>.02){ g.globalAlpha=MJ.pulse*.8; const r2=Z*.5; g.drawImage(SPR,Z*.5-r2,top*Z-r2*.6,r2*2,r2*2); }
    g.restore();

requestAnimationFrame(miniJar);
function chimeN(n){ if(!soundOn) return; const keep=S.lights; S.lights=n; chime(false,true); S.lights=keep; }

function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
function why(i){
  const s=document.createElement('div'); s.className='sheet';
  s.innerHTML='<div class="in"><div class="eyebrow">'+esc(t('why'))+'</div><p>'+esc(tx(C.ciencia[i]))+'</p><button class="btn ghost">'+esc(t('close'))+'</button></div>';
  s.onclick=e=>{ if(e.target===s||e.target.tagName==='BUTTON') s.remove(); };
  document.body.appendChild(s);
}
function addLight(big, from, quiet){
  S.lights++; save();
  const r=(from||view).getBoundingClientRect(), m=$('#mj').getBoundingClientRect();
  const f=document.createElement('div'); f.className='fly'; document.body.appendChild(f);
  const x0=r.left+r.width/2-11, y0=r.top+r.height/2-11, x1=m.left+m.width/2-11, y1=m.top+m.height/2-11;
  f.animate([{transform:`translate(${x0}px,${y0}px) scale(${big?1.6:1})`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.3)`,opacity:.2}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{ f.remove(); bar(); MJ.pulse=1; $('#mj').animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.3,1.6,.5,1)'}); };
  if(!quiet) chime(big);
}

/* ---------- ronda 1: detective ---------- */
function detective(){
  const pool=shuffle(C.detective.filter(q=>!S.far||q.d)); let i=0, turn=0; const N=6;
  const card=()=>screen(()=>{
    const q=pool[i % pool.length];
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
      <img class="icon sm" src="img/detective.webp" alt="">
      <div class="card flip" id="card"><div class="eyebrow">${esc(split(t('r1'))[0])} · ${turn+1}/${N}</div><div class="q">${esc(tx(q))}</div></div></div>
      <div class="actions"><div class="row"><button class="btn ghost" id="no">${esc(t('almost'))}</button><button class="btn gold" id="yes">${esc(t('yes'))}</button></div>
      <button class="skip" id="sk">${esc(t('skip'))}</button></div>`,
    ()=>{ sfx('flip');
      /* solo «¡Lo notaste!» suma luz; «Casi» no suma (un toque suave, sin destello) */
      const done=ok=>{ toast(ok?t('yesMsg'):t('almostMsg')); if(ok) addLight(false,$('#card')); else sfx('tick'); i++; turn++;
        setTimeout(()=>{ if(turn>=N) recuerdo(); else passScreen(card); }, 950); };
      $('#yes').onclick=()=>done(true); $('#no').onclick=()=>done(false);
      $('#sk').onclick=()=>{ i++; toast(t('skipMsg')); card(); };
    });
  });
  roundIntro('r1','detective',null,()=>passScreen(card,t('whoStarts')));
}

/* ---------- ronda 3: la fórmula ---------- */
function formula(){
  let turn=0, who=0; /* who: 0 = quien empezó, 1 = su pareja (cambia cada vez que se pasan el teléfono) */
  const step1=()=>screen(()=>{
    const opts=shuffle(C.graciasPor).slice(0,5);
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
      <img class="icon sm" src="img/gracias.webp" alt="">
      <h2>${esc(t('f1'))}</h2><div class="small">${esc(t('pickOne'))}</div>
      <div class="chips">${opts.map((o,k)=>`<button class="chip" data-k="${k}">${esc(tx(o))}</button>`).join('')}
      <button class="chip" data-k="-1">${esc(t('other'))}</button></div></div>
      <div class="actions"><button class="skip" id="sk">${esc(t('skip'))}</button></div>`,
    ()=>{
      view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ sfx('tick'); const k=+b.dataset.k; step2(k<0?null:opts[k]); });
      $('#sk').onclick=()=>{ toast(t('skipMsg')); nextTurn(); };
    });
  });
  const step2=por=>screen(()=>{
    const opts=shuffle(C.cualidades).slice(0,9);
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
      <h2>${esc(t('f2'))}</h2>
      <div class="chips">${opts.map((o,k)=>`<button class="chip" data-k="${k}">${esc(tx(o))}</button>`).join('')}</div>
      <button class="why" id="w">${esc(t('why'))}</button></div>
      <div class="actions"><button class="skip" id="sk">${esc(t('skip'))}</button></div>`,
    ()=>{
      view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ sfx('tick'); step3(por,opts[+b.dataset.k]); });
      $('#w').onclick=()=>why(2); $('#sk').onclick=()=>step3(por,null);
    });
  });
  const step3=(por,cual)=>screen(()=>{
    const porTxt = por?tx(por):'…', cualTxt = cual?tx(cual):'…';
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
      <div class="eyebrow">${esc(t('f3'))}</div>
      <div class="card" style="margin-top:14px"><div class="phrase" style="color:var(--ink)">${esc(t('f1').replace('…',''))} <em style="color:#b0743a">${esc(porTxt.replace(/\.$/,''))}</em>.<br>${esc(t('f2').replace('…',''))} <em style="color:#b0743a">${esc(cualTxt)}</em>.</div></div></div>
      <div class="actions"><button class="btn" id="go">${esc(t('lookGo'))}</button></div>`,
    ()=>{ $('#go').onclick=()=>look(por,cual); });
  });
  /* 10 segundos SIN cronómetro: dos luces (una por cada quien) se buscan despacio y al final se juntan en una sola.
     No hay números ni barras que se vacíen: nada que se pueda "contar" ni que haga sentir que se acaba el tiempo. */
  const look=(por,cual)=>screen(()=>{
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
      <h2>${esc(t('look10'))}</h2>
      <div class="meet"><canvas id="meet"></canvas></div>
      <p class="small" style="margin:0 0 6px">${esc(t('lookWait'))}</p><p class="lead">${esc(t('hug'))}</p></div>
      <div class="actions"><button class="skip" id="sk">${esc(t('skip'))}</button></div>`,
    ()=>{
      const cv=$('#meet'), g=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
      const Wc=cv.clientWidth, Hc=cv.clientHeight; cv.width=Wc*dpr; cv.height=Hc*dpr;
      const T=10000; let t0=null, merged=0, stop=false; const trail=[[],[]], motes=[];
      const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      const fin=()=>{ if(por||cual){ S.gracias.push({por:por||null,cual:cual||null,who}); save(); }
        sfx('done10'); try{ navigator.vibrate && navigator.vibrate([30,50,30]); }catch(e){}
        addLight(true,cv,true); toast(t('oneMore')); setTimeout(()=>{ stop=true; nextTurn(); },1600); };
      const frame=now=>{
        if(stop||!cv.isConnected) return; if(t0===null) t0=now;
        const k=Math.min(1,(now-t0)/T), e=ease(k), t=now/1000, cx=Wc/2, cy=Hc/2;
        g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,Wc,Hc); g.globalCompositeOperation='lighter';
        /* calor entre las dos luces: crece y respira despacio */
        const warm=(.1+.38*e)*(.85+.15*Math.sin(t*1.6));
        let gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.min(Wc,Hc*1.6)*.5); gr.addColorStop(0,`rgba(255,200,120,${warm})`); gr.addColorStop(1,'rgba(255,160,70,0)'); g.fillStyle=gr; g.fillRect(0,0,Wc,Hc);
        if(!merged){
          const d=(1-e)*Wc*.3;
          const P=[[cx-d+Math.sin(t*1.1)*5, cy+Math.sin(t*1.7)*9],[cx+d+Math.sin(t*1.3+1)*5, cy+Math.cos(t*1.5)*9]];
          P.forEach((q,i)=>{ const tr=trail[i], spr=SPRS[i?1:2]; tr.unshift(q[0],q[1]); if(tr.length>30) tr.length=30;
            for(let j=2;j<tr.length;j+=2){ const f=1-j/tr.length; g.globalAlpha=.3*f; const r=7*f+2; g.drawImage(spr,tr[j]-r,tr[j+1]-r,r*2,r*2); }
            const b=.8+.2*Math.sin(t*2.2+i*2); g.globalAlpha=.35*b; let r=58*b; g.drawImage(spr,q[0]-r,q[1]-r,r*2,r*2);
            g.globalAlpha=1; r=20*b; g.drawImage(spr,q[0]-r,q[1]-r,r*2,r*2);
            if(Math.random()<.12) motes.push({x:q[0],y:q[1],vx:(Math.random()-.5)*.4,vy:-.3-Math.random()*.5,a:1});
          });
          if(k>=1){ merged=now; for(let j=0;j<22;j++){ const a=Math.random()*6.28, v=1+Math.random()*2.6; motes.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1}); } fin(); }
        } else {
          /* se juntan: una sola luz que florece y se va al frasco */
          const m=Math.min(1,(now-merged)/1300);
          g.globalAlpha=(1-m)*.9; let r=50+150*m; g.drawImage(SPR,cx-r,cy-r,r*2,r*2);
          g.globalAlpha=1-m; r=30+12*Math.sin(m*3.14); g.drawImage(SPRS[2],cx-r,cy-r,r*2,r*2);
        }
        for(let j=motes.length-1;j>=0;j--){ const q=motes[j]; q.x+=q.vx; q.y+=q.vy; q.vx*=.97; q.vy*=.97; q.a-=.018; if(q.a<=0){ motes.splice(j,1); continue; }
          g.globalAlpha=q.a*.85; g.drawImage(SPRS[2],q.x-4,q.y-4,8,8); }
        g.globalAlpha=1; g.globalCompositeOperation='source-over';
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
      $('#sk').onclick=()=>{ stop=true; nextTurn(); };
    });
  });
  const nextTurn=()=>{ turn++; if(turn<2){ who^=1; passScreen(step1); } else afterFormula(); };
  const afterFormula=()=>screen(()=>show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
      ${jarHTML(S.lights)}<p class="lead">${esc(t('oneMore'))}</p></div>
      <div class="actions"><button class="btn" id="go">${esc(t('nextRound'))}</button><button class="btn ghost" id="more">${esc(t('anotherThanks'))}</button></div>`,
    ()=>{ $('#go').onclick=secretRound; $('#more').onclick=()=>{ turn=1; who^=1; passScreen(step1); }; }));
  roundIntro('r3','gracias',1,()=>passScreen(step1));
}

function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }
function wrap(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,yy); line=w; yy+=lh; } else line=test; }
  ctx.fillText(line,x,yy); return yy+lh;
}
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function seeded(n){ let v=(n*9301+49297)%233280; return ()=>{ v=(v*9301+49297)%233280; return v/233280; }; }
/* Tarjeta para compartir (1080x1350): cielo de noche, el frasco de vidrio encendido con sus luces y una nota de papel crema */
async function makeCard(){
  try{ await document.fonts.ready; await Promise.all(['700 58px Fraunces','500 42px Fraunces','italic 500 38px Fraunces','700 30px "DM Sans"','500 26px "DM Sans"'].map(f=>document.fonts.load(f))); }catch(e){}
  const W=1080,H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); const R=seeded(S.lights+11);
  const lv=Math.max(.4,Math.min(1,S.lights/14));
  let gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2b1e47'); gr.addColorStop(.45,'#1a1636'); gr.addColorStop(1,'#120f26'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='#fff3d6'; for(let i=0;i<110;i++){ g.globalAlpha=.15+R()*.55; g.beginPath(); g.arc(R()*W,R()*600,.4+R()*1.6,0,7); g.fill(); } g.globalAlpha=1;
  const JS=420, JX=(W-JS)/2, JY=22;
  gr=g.createRadialGradient(W/2,JY+JS*.6,0,W/2,JY+JS*.6,540); gr.addColorStop(0,`rgba(255,175,85,${.45*lv})`); gr.addColorStop(.5,`rgba(255,140,60,${.15*lv})`); gr.addColorStop(1,'rgba(255,140,60,0)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  /* luz y luciérnagas dentro del vidrio */
  g.save(); g.translate(JX,JY); jarPath(g,JS,JS); g.clip(); g.globalCompositeOperation='lighter';
  gr=g.createRadialGradient(JS*.5,JS*.64,0,JS*.5,JS*.64,JS*.37); gr.addColorStop(0,`rgba(255,215,140,${.55*lv})`); gr.addColorStop(.6,`rgba(255,170,80,${.22*lv})`); gr.addColorStop(1,'rgba(255,150,60,0)'); g.fillStyle=gr; g.fillRect(0,0,JS,JS);
  g.save(); g.translate(JS*.5,JS*.85); g.scale(1,.2); gr=g.createRadialGradient(0,0,0,0,0,JS*.25); gr.addColorStop(0,`rgba(255,232,175,${.75*lv})`); gr.addColorStop(1,'rgba(255,180,90,0)'); g.fillStyle=gr; g.beginPath(); g.arc(0,0,JS*.25,0,7); g.fill(); g.restore();
  const n=Math.max(10,Math.min(44,S.lights*3));
  for(let i=0;i<n;i++){ const x=(BOX.x0+.03+R()*(BOX.x1-BOX.x0-.06))*JS, y=(BOX.y0+R()*(BOX.y1-BOX.y0))*JS, big=R()<.3, r=(big?20:8)+R()*(big?14:8), spr=SPRS[i%SPRS.length];
    g.globalAlpha=.13; g.drawImage(spr,x-r*2.4,y-r*2.4,r*4.8,r*4.8); g.globalAlpha=.9; g.drawImage(spr,x-r,y-r,r*2,r*2); }
  g.fillStyle='rgba(255,230,170,1)'; for(let i=0;i<34;i++){ g.globalAlpha=.15+R()*.45; g.beginPath(); g.arc((BOX.x0+R()*(BOX.x1-BOX.x0))*JS,(.3+R()*.55)*JS,1+R()*1.6,0,7); g.fill(); }
  g.restore();
  /* el vidrio encima (las luces quedan adentro) y teñido de ámbar según cuántas luces hay */
  const jar=await loadImg('img/frasco-apagado.webp');
  if(jar){ g.drawImage(jar,JX,JY,JS,JS);
    const o=document.createElement('canvas'); o.width=o.height=JS; const og=o.getContext('2d'); og.drawImage(jar,0,0,JS,JS); og.globalCompositeOperation='source-atop'; og.fillStyle='rgba(255,165,70,.6)'; og.fillRect(0,0,JS,JS);
    g.globalCompositeOperation='screen'; g.globalAlpha=.85*lv; g.drawImage(o,JX,JY); g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
  g.globalCompositeOperation='lighter';
  for(let i=0;i<16;i++){ const a=R()*6.28, rr=JS*(.38+R()*.2), x=W/2+Math.cos(a)*rr, y=JY+JS*.55+Math.sin(a)*rr*.8, r=4+R()*9; g.globalAlpha=.45+R()*.45; g.drawImage(SPRS[2],x-r,y-r,r*2,r*2); }
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.textAlign='center'; g.font='700 30px "DM Sans", sans-serif'; g.fillStyle='#f2c46b'; try{ g.letterSpacing='5px'; }catch(e){}
  g.fillText(`✦  ${S.lights} ${t('lights').toUpperCase()}  ✦`, W/2, JY+JS+18); try{ g.letterSpacing='0px'; }catch(e){}
  /* nota de papel */
  const PX=70, PY=JY+JS+50, PW=W-140, PH=H-PY-96;
  g.save(); g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=40; g.shadowOffsetY=16; rrect(g,PX,PY,PW,PH,34);
  gr=g.createLinearGradient(0,PY,0,PY+PH); gr.addColorStop(0,'#fcf5e8'); gr.addColorStop(1,'#f1e1c6'); g.fillStyle=gr; g.fill(); g.restore();
  rrect(g,PX+14,PY+14,PW-28,PH-28,24); g.strokeStyle='rgba(201,150,70,.55)'; g.lineWidth=2; g.stroke();
  const N=S.names&&S.names[0]&&S.names[1]?S.names:null;
  const side=(g,i)=>(g.who===0||g.who===1)?g.who:i%2;
  const groups=[0,1].map(w=>S.gracias.filter((g,i)=>side(g,i)===w && (g.por||g.cual)).slice(-2));
  const heads=N?[t('cardFrom').replace('{a}',N[0]).replace('{b}',N[1]), t('cardFrom').replace('{a}',N[1]).replace('{b}',N[0])]:[t('cardGiven'),t('cardReturned')];
  const close=t('cardKeep'+(1+rnd(3)));
  const date=new Date().toLocaleDateString(L==='es'?'es-ES':'en-US',{day:'numeric',month:'long',year:'numeric'});
  const cx=W/2, mw=PW-110;
  const lines=(txt)=>{ const out=[]; let line=''; for(const w of txt.split(' ')){ const tst=line?line+' '+w:w; if(g.measureText(tst).width>mw&&line){ out.push(line); line=w; } else line=tst; } out.push(line); return out; };
  const orn=(y,wd)=>{ g.strokeStyle='rgba(176,116,58,.5)'; g.lineWidth=2; g.beginPath(); g.moveTo(cx-wd,y); g.lineTo(cx-22,y); g.moveTo(cx+22,y); g.lineTo(cx+wd,y); g.stroke();
    g.save(); g.translate(cx,y); g.rotate(Math.PI/4); g.fillStyle='#d39a45'; g.fillRect(-6,-6,12,12); g.restore(); };
  const lay=(sc,draw)=>{ let y=PY+92*sc;
    const put=(txt,font,color,lh,ls)=>{ g.font=font; g.fillStyle=color; try{ g.letterSpacing=ls||'0px'; }catch(e){} for(const l of lines(txt)){ if(draw) g.fillText(l,cx,y); y+=lh; } try{ g.letterSpacing='0px'; }catch(e){} };
    put(t('cardUs'),`700 ${Math.round(56*sc)}px Fraunces, Georgia, serif`,'#2b2135',0); y+=38*sc;
    if(draw) orn(y,140); y+=70*sc;
    let first=true;
    groups.forEach((items,w)=>{ if(!items.length) return;
      if(!first){ y+=4*sc; if(draw) orn(y-18*sc,70); y+=40*sc; } first=false;
      put(heads[w].toUpperCase(),`700 ${Math.round(29*sc)}px "DM Sans", sans-serif`,'#b0743a',52*sc,'4px');
      for(const it of items){
        const por=it.por?it.por[L].replace(/\.$/,''):'';
        if(por) put(t('thanksFor')+' '+por+'.',`500 ${Math.round(40*sc)}px Fraunces, Georgia, serif`,'#2b2135',52*sc);
        if(it.cual) put(t('youAre')+' '+it.cual[L]+'.',`700 ${Math.round(46*sc)}px Fraunces, Georgia, serif`,'#a4502f',58*sc);
        y+=18*sc;
      }
    });
    y+=first?10*sc:22*sc;
    put(close,`italic 500 ${Math.round(37*sc)}px Fraunces, Georgia, serif`,'#6a5470',48*sc);
    return y;
  };
  let sc=1.25; while(sc>.6 && lay(sc,false)>PY+PH-70) sc-=.03;
  lay(sc,true);
  g.font='500 24px "DM Sans", sans-serif'; g.fillStyle='rgba(120,90,60,.75)'; g.fillText(date, cx, PY+PH-40);
  g.font='500 26px "DM Sans", sans-serif'; g.fillStyle='rgba(242,196,107,.85)'; g.fillText(t('cardFoot'), cx, H-46);
  return new Promise(r=>cv.toBlob(b=>r(b),'image/png'));
}
function finale(){

    <button class="why" id="w">${esc(t('why'))}</button></div>

  screen(()=>show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
    <img class="icon sm" src="img/gracias.webp" alt=""><h2>${esc(t('namesQ'))}</h2>

async function cardScreen(){
  if(S.names===undefined && S.gracias.length) return namesScreen();
  let blob=null; try{ blob=await makeCard(true); }catch(e){ try{ blob=await makeCard(false); }catch(e2){} } if(!blob){ return; }
  const url=URL.createObjectURL(blob); const file=new File([blob],'lo-que-nos-notamos.png',{type:'image/png'});
  const canShare = navigator.canShare && navigator.canShare({files:[file]});
  screen(()=>show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <img class="cardimg" src="${url}" alt=""></div>
    <div class="actions">${canShare?`<button class="btn gold" id="sh">${esc(t('share'))}</button>`:''}
    <a class="btn ${canShare?'ghost':'gold'}" id="dl" href="${url}" download="lo-que-nos-notamos.png" style="text-decoration:none;display:block">${esc(t('saveCard'))}</a>
    <button class="skip" id="home">${esc(t('close'))}</button></div>`,
  ()=>{ if(canShare) $('#sh').onclick=()=>navigator.share({files:[file]}).catch(()=>{}); $('#home').onclick=home; }));
}

/* ---------- día siguiente ---------- */
function nextDay(){
  let k=0; const list=S.secrets.slice();
  const one=()=>screen(()=>{
    const real=list[k]; const pool=secretPool().map(o=>o.i).filter(i=>i!==real);
    const opts=shuffle([real].concat(shuffle(pool).slice(0,2)));
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;gap:10px">
      <img class="icon sm" src="img/secreto.webp" alt=""><div class="small">${esc(t('revealWho'))}</div><h2 style="font-size:24px">${esc(t('guessQ'))}</h2>
      ${opts.map(i=>`<button class="opt" data-i="${i}">${esc(tx(C.secretos[i]))}</button>`).join('')}</div>
      <div class="actions"><button class="skip" id="nd">${esc(t('notDone'))}</button></div>`,
    ()=>{
      const finish=msg=>{ toast(msg); setTimeout(()=>{ k++; if(k<list.length) passScreen(one); else unlock(); },1500); };
      view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const ok=+b.dataset.i===real;
        view.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; x.classList.add(+x.dataset.i===real?'right':'wrong'); });
        if(ok) addLight(false,b); else sfx('tick'); finish(ok?t('guessYes'):t('guessNo'));
      });
      $('#nd').onclick=()=>finish(t('notDone'));
    });
  });
  screen(()=>show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <img class="icon" src="img/secreto.webp" alt=""><h2>${esc(t('nextDayOpen'))}</h2><button class="why" id="w">${esc(t('why'))}</button></div>
    <div class="actions"><button class="btn" id="go">${esc(t('next'))}</button></div>`,
  ()=>{ $('#w').onclick=()=>why(0); $('#go').onclick=one; }));
}
function unlock(){
  S.guessed=true; save();
  screen(()=>show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    ${jarHTML(S.lights)}<h2>${esc(t('unlock7'))}</h2></div>
    <div class="actions"><button class="btn gold" id="go">${esc(t('start7'))}</button><button class="skip" id="home">${esc(t('close'))}</button></div>`,
  ()=>{ $('#go').onclick=sevenDays; $('#home').onclick=home; chime(true); }));
}

/* ---------- modo 7 días ---------- */
function sevenDays(){
  screen(()=>{
    const done=S.d7.done; const n=done.length; const lockedToday = n>0 && done[n-1]===today() && !TEST;
    const dots=[0,1,2,3,4,5,6].map(i=>`<span class="${i<n?'ok':(i===n?'now':'')}">${i+1}</span>`).join('');
    if(n>=7) return openJar();
    const [title,instr]=split(tx(C.dias[n]));
    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
      ${jarHTML(S.lights,{style:'width:min(44vw,170px,22vh)'})}
      <div class="days">${dots}</div>
      ${lockedToday?`<h2>${esc(t('dayLocked'))}</h2>`:
      `<div class="card flip" id="card" style="margin-top:8px"><div class="eyebrow">${esc(title)}</div><div class="q">${esc(instr)}</div></div>`}
      <button class="why" id="w">${esc(t('why'))}</button></div>
      <div class="actions">${lockedToday?`<button class="btn ghost" id="home">${esc(t('close'))}</button>`:
      `<button class="btn gold" id="ok">${esc(t('done'))}</button><button class="skip" id="home">${esc(t('close'))}</button>`}</div>`,
    ()=>{ if(!lockedToday) sfx('flip'); $('#w').onclick=()=>why(3); $('#home').onclick=home;
      if(!lockedToday) $('#ok').onclick=()=>{ S.d7.done.push(today()); save(); addLight(n===6,$('#card')); setTimeout(()=>{ if(S.d7.done.length>=7) openJar(); else sevenDays(); },1000); };
    });
  });
}

    show(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%">
